<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="LernArcade Logo">
  <title>LernArcade</title>
  <defs>
    <linearGradient id="lafavicon-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1030"/><stop offset="0.6" stop-color="#151a4a"/><stop offset="1" stop-color="#24124f"/>
    </linearGradient>
    <radialGradient id="lafavicon-glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lafavicon-t0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="lafavicon-t1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#15803d"/></linearGradient>
    <linearGradient id="lafavicon-t2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <linearGradient id="lafavicon-t3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
    <filter id="lafavicon-blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="lafavicon-clip"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#lafavicon-bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#lafavicon-glow)"/>
  <g clip-path="url(#lafavicon-clip)">
    <g transform="translate(0 0) scale(1)">
      
      <rect x="74" y="74" width="184" height="184" rx="30" fill="url(#lafavicon-t0)"/><rect x="254" y="74" width="184" height="184" rx="30" fill="url(#lafavicon-t1)"/><rect x="74" y="254" width="184" height="184" rx="30" fill="url(#lafavicon-t2)"/><rect x="254" y="254" width="184" height="184" rx="30" fill="url(#lafavicon-t3)"/>
      
    </g>
  </g>
</svg>
